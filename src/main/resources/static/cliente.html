<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes | Punto de Venta</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="topbar barra-nav">
    <div><h1>Clientes</h1><p>Administración de clientes</p></div>
    <nav>
      <a href="/">Inicio</a>
      <a href="/categoria.html">Categorías</a>
      <a href="/producto.html">Productos</a>
      <a class="activo" href="/cliente.html">Clientes</a>
    </nav>
  </header>

  <main class="contenedor grid-principal">
    <section class="panel">
      <h2>Registrar cliente</h2>
      <form id="formCliente">
        <div class="dos-columnas">
          <label>Nombre<input id="nombre" required maxlength="100"></label>
          <label>Apellido<input id="apellido" required maxlength="100"></label>
        </div>
        <label>Correo electrónico<input id="email" type="email" required maxlength="150"></label>
        <label>Teléfono<input id="telefono" maxlength="30"></label>
        <button type="submit">Guardar cliente</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </section>

    <section class="panel panel-tabla">
      <div class="encabezado-tabla">
        <div><h2>Clientes activos</h2><p>Datos obtenidos desde Spring Boot</p></div>
        <div class="buscador">
          <input id="filtro" placeholder="Buscar por nombre...">
          <button id="btnBuscar" type="button" class="secundario">Buscar</button>
          <button id="btnTodos" type="button" class="claro">Todos</button>
        </div>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Email</th><th>Teléfono</th><th>Registro</th></tr></thead>
          <tbody id="tablaClientes"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/js/cliente.js"></script>
</body>
</html>
